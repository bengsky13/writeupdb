[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-search-backend"
version = "0.1.0"
description = "Offline CTF writeup search backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.3",
  "bleach>=6.1.0",
  "fastapi>=0.115.0",
  "html5lib>=1.1",
  "markdown-it-py>=3.0.0",
  "orjson>=3.10.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.10",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "rq>=1.16.2",
  "sqlalchemy>=2.0.32",
  "structlog>=24.4.0",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
ml = [
  "onnxruntime>=1.19.0",
  "sentence-transformers>=3.0.1",
]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

