services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ctfsearch
      POSTGRES_USER: ctfsearch
      POSTGRES_PASSWORD: ctfsearch
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfsearch -d ctfsearch"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      EMBEDDING_PROVIDER: fake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./imports:/data/imports
      - ./models:/models:ro

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      EMBEDDING_PROVIDER: fake
    command: ["python", "-m", "app.workers.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./imports:/data/imports
      - ./models:/models:ro

  watcher:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      EMBEDDING_PROVIDER: fake
    command: ["python", "-m", "app.workers.watcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./imports:/data/imports
      - ./models:/models:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    environment:
      INTERNAL_API_BASE: http://backend:8000
      NEXT_PUBLIC_API_BASE: ""
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
